name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - name: Install native dependencies
        run: |
          timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 300 sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y build-essential libasound2-dev libflac-dev libmpg123-dev libogg-dev libvorbis-dev g++-mingw-w64-x86-64
      - name: Collect third-party licenses
        run: python3 scripts/collect-licenses.py
      - name: Build release and manifest
        env:
          UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Build Windows release and add it to the manifest
        env:
          UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: ./scripts/build-release.sh
      - name: Check version and archive
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(./spotirip-lossless-linux-amd64/spotirip-lossless --version)"
          sha256sum -c spotirip-lossless-linux-amd64.tar.gz.sha256
          sha256sum -c spotirip-lossless-windows-amd64.tar.gz.sha256
          python3 -c 'import json; m = json.load(open("update-manifest.json")); assert set(m["platforms"]) == {"linux-amd64", "windows-amd64"}'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/spotirip-lossless-linux-amd64.tar.gz
          dist/spotirip-lossless-linux-amd64.tar.gz.sha256
          dist/spotirip-lossless-windows-amd64.tar.gz
          dist/spotirip-lossless-windows-amd64.tar.gz.sha256
          dist/update-manifest.json
          --title "SpotiRip Lossless ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
